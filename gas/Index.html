<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<title>إقفال صناديق الكاشير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: phone-first single column — sticky date bar on top, tab content, fixed bottom nav; receipts are 80mm paper slips */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --ink:#16201c; --muted:#5f6c67; --line:#dde3e0;
  --accent:#1d3a5f; --accent-ink:#ffffff; --accent-soft:#e3eaf3;
  --short:#b3261e; --short-soft:#fbe8e6; --over:#9a5800; --over-soft:#fdf0db; --ok:#1d7a45; --ok-soft:#e3f3e9;
  --paper:#ffffff; --paper-ink:#000000; --paper-line:#000000; --shade:rgba(10,20,18,.45);
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1315; --surface:#162024; --ink:#e5ebe8; --muted:#94a29c; --line:#27343a;
  --accent:#8fb3e6; --accent-ink:#0e1a2b; --accent-soft:#1b293b;
  --short:#ff8f86; --short-soft:#3a1b19; --over:#f1b65c; --over-soft:#382a13; --ok:#6fd096; --ok-soft:#15301f; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1315; --surface:#162024; --ink:#e5ebe8; --muted:#94a29c; --line:#27343a;
  --accent:#8fb3e6; --accent-ink:#0e1a2b; --accent-soft:#1b293b;
  --short:#ff8f86; --short-soft:#3a1b19; --over:#f1b65c; --over-soft:#382a13; --ok:#6fd096; --ok-soft:#15301f; --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand b{font-family:var(--f-display);font-size:15px;font-weight:700}
.brand small{color:var(--muted);font-size:12px;display:block}
.datebar{display:flex;align-items:center;gap:8px}
.datebar .nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.datepick{flex:1;position:relative;height:40px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.saved{background:var(--ok-soft);color:var(--ok)}
.pill.dirty{background:var(--over-soft);color:var(--over)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.brand-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill.role{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:3px 10px;font-weight:600;font-size:12px}
.login{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.rolebtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:600;font-size:16px}
.rolebtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--accent)}

main .wrap{padding-block:14px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-size:16px;margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* totals strip */
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:17px}
.stat.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.stat.short{background:var(--short-soft);border-color:transparent}.stat.short b{color:var(--short)}
.stat.over{background:var(--over-soft);border-color:transparent}.stat.over b{color:var(--over)}
.stat.ok{background:var(--ok-soft);border-color:transparent}.stat.ok b{color:var(--ok)}

/* box grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:360px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:76px;justify-content:center}
.tile .n{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
.tile .who{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:11px;font-weight:600}
.tile.ok{border-color:var(--ok);}.tile.ok .d{color:var(--ok)}
.tile.short{border-color:var(--short);background:var(--short-soft)}.tile.short .d{color:var(--short)}
.tile.over{border-color:var(--over);background:var(--over-soft)}.tile.over .d{color:var(--over)}
.tile.ret{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;padding:12px 14px;min-height:0;border-style:dashed;text-align:start}
.tile.ret .n{font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px;border:1px solid var(--line)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--short);border-color:var(--short)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1}

/* save bar + nav */
.savebar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:6;pointer-events:none}
.savebar .wrap{padding-block:8px;pointer-events:auto}
.savebar .btn{width:100%;padding:13px;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:60px}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--bg)}
td.n,th.n{text-align:left}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--accent-soft);border-top:1px solid var(--line)}
tr.click{cursor:pointer}
.neg{color:var(--short)}.pos{color:var(--over)}.zero{color:var(--ok)}

/* forms */
.field{display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:14px}
.inp{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;font-size:16px}
.inp.money{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
textarea.inp{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.calc{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-weight:600}
.group-h{font-family:var(--f-display);font-size:13px;color:var(--accent);margin:10px 0 2px}
.banner{border-radius:10px;padding:10px;text-align:center;font-weight:700;margin-top:8px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}.banner.short{background:var(--short-soft);color:var(--short)}.banner.over{background:var(--over-soft);color:var(--over)}
.note{font-size:13px;color:var(--muted)}
.info{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px;font-size:13px}

/* sheet / modal */
.sheet-bg{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line);gap:8px}
.sheet-b{overflow-y:auto;padding:6px 16px 14px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.ret-line{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px dashed var(--line)}
.ret-line .full{grid-column:1/3}
.ret-line small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.ret-line .x{align-self:center}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 2px;border-radius:8px;font-size:13px;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.period{display:flex;gap:8px;flex-wrap:wrap}
.period .inp{flex:1;min-width:130px}

.bars{display:block;width:100%;height:auto}
.bars text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.bars .b{fill:var(--accent)}
.bars .g{stroke:var(--line);stroke-width:1}
.mix{display:flex;flex-direction:column;gap:8px}
.mix .r{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:8px;font-size:13px}
.mix .t{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.mix .t i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* paper preview */
.paper-wrap{background:var(--bg);border-radius:10px;padding:14px;display:flex;justify-content:center;overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-size:14px;max-width:90vw;text-align:center}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}

/* receipt — 80mm cashier paper, always printed black on white */
.rcpt{width:302px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);font-size:12px;line-height:1.45;padding:14px 12px 18px;direction:rtl}
.rcpt .c{text-align:center}
.rcpt .t1{font-family:var(--f-display);font-size:15px;font-weight:700;text-align:center}
.rcpt .t2{font-size:11.5px;text-align:center}
.rcpt .t3{font-weight:700;text-align:center;border:1.5px solid var(--paper-line);padding:3px;margin:8px 0;font-size:13px}
.rcpt .r{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;border-bottom:1px dotted var(--paper-line)}
.rcpt .r b,.rcpt .r span:last-child{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.rcpt .h{font-weight:700;text-align:center;background:var(--paper-ink);color:var(--paper);padding:2px;margin:8px 0 3px;font-size:12px}
.rcpt .tot{font-weight:700;border-top:1.5px solid var(--paper-line);border-bottom:1.5px solid var(--paper-line)}
.rcpt .st{text-align:center;font-weight:700;margin:8px 0;padding:4px;border:1.5px dashed var(--paper-line)}
.rcpt .sig{margin-top:18px;display:flex;justify-content:space-between;gap:8px}
.rcpt .sig div{flex:1;text-align:center;border-top:1px solid var(--paper-line);padding-top:3px;font-size:11px}
.rcpt table{font-size:10.5px;width:100%;border-collapse:collapse;margin-top:4px}
.rcpt th,.rcpt td{padding:2px 2px;border-bottom:1px dotted var(--paper-line);white-space:nowrap;background:var(--paper);color:var(--paper-ink);font-weight:inherit}
.rcpt th{font-weight:700;border-bottom:1.5px solid var(--paper-line)}
.rcpt td.n,.rcpt th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
.rcpt tfoot td{font-weight:700;border-top:1.5px solid var(--paper-line);background:var(--paper)}
.rcpt .who{max-width:70px;overflow:hidden;text-overflow:ellipsis}
.rcpt .foot{text-align:center;margin-top:12px;font-size:11px}
.rcpt .notes{border:1px solid var(--paper-line);min-height:34px;padding:4px;margin-top:3px;white-space:pre-wrap}
#stage{position:absolute;top:0;left:0;z-index:-5;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

.pill.err{background:var(--short-soft);color:var(--short)}
.scard{display:flex;flex-direction:column;gap:2px}.scard.is-short{border-color:var(--short)}.scard.is-over{border-color:var(--over)}
.mini{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}.mini b{color:var(--ink)}
a.btn{text-decoration:none;color:inherit}a.btn.primary{color:var(--accent-ink)}
.staff{padding:10px 0;border-bottom:1px dashed var(--line)}.staff:last-child{border-bottom:0}.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.sgrid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.tabs button{font-size:11px}
.mwrap{position:relative;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}.mwrap .inp{flex:1;min-width:0}.plusb{flex:none;width:38px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:700;line-height:1}.plusb:disabled{opacity:.4}.xh{flex-basis:100%;font-size:12px;color:var(--ok);font-weight:600;direction:ltr;text-align:left;min-height:0}.xh:empty{display:none}
.denom{margin:2px 0 6px;border:1px dashed var(--line);border-radius:10px;padding:6px 10px}.denom summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}.dgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.dgrid label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);text-align:center;min-width:0}.dgrid .inp{height:36px;text-align:center;padding:0 4px}
.live{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.live.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.live.off{background:var(--muted)}
.toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}

}

/* print layout: fluid width, type fitted per paper */
.rcpt table{font-size:.92em}
.rcpt td.who,.rcpt th.who{white-space:normal;max-width:none;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}

.rcpt tr,.rcpt .r,.rcpt .st,.rcpt .sig,.rcpt .a4i,.rcpt .a4s>div{break-inside:avoid;page-break-inside:avoid}
.rcpt .h{break-after:avoid;page-break-after:avoid}
.rcpt thead{display:table-header-group}
#pv .rcpt,#stage .rcpt{width:72mm;max-width:none}

.rcpt .t1{font-size:1.3em}.rcpt .t2{font-size:1em}.rcpt .t3{font-size:1.13em}.rcpt .h{font-size:1.04em}.rcpt .sig div,.rcpt .foot{font-size:.95em}
.a4 .rcpt .t1{font-size:1.5em}.a4 .rcpt .t3{font-size:1.15em}
.rcpt th{white-space:normal;line-height:1.15}.rcpt:not(.a4p) th,.rcpt:not(.a4p) td{font-size:inherit}.fitm:not(.a4) .rcpt td,.fitm:not(.a4) .rcpt th,#pv:not(.a4) .rcpt td,#pv:not(.a4) .rcpt th,#printArea:not(.a4) .rcpt td,#printArea:not(.a4) .rcpt th,#stage:not(.a4) .rcpt td,#stage:not(.a4) .rcpt th{padding:2px 1px}.rcpt td.n,.rcpt th.n{font-variant-numeric:normal;padding-inline-start:3px}

  #printArea .rcpt,#printArea.a4 .rcpt,#printArea.a4 .rcpt.a4p{width:auto!important;max-width:none!important;margin:0!important}

/* settings hub */
.set-head{display:flex;align-items:center;gap:12px;padding:4px 2px 14px}
.set-head img{width:52px;height:52px;object-fit:contain;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:4px}
.set-head b{display:block;font-family:var(--f-display);font-size:17px}
.set-ic{flex:none;width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.set-ic.big{width:52px;height:52px;border-radius:14px}
.set-ic svg,.set-chev svg,.set-back svg,.set-search svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:17px;height:17px;margin-inline-end:4px;vertical-align:-3px}
.set-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.set-row,.person{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer;min-height:64px}
.set-row:first-child,.person:first-child{border-top:0}
.set-row:hover,.person:hover{background:var(--accent-soft)}
.set-row:focus-visible,.person:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.set-txt,.p-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.set-txt b,.p-txt b{font-size:15px}
.set-txt .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-chev{color:var(--muted);flex:none;display:grid}
.set-top{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.set-back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:6px 2px;cursor:pointer;min-height:40px}
.set-title{display:flex;align-items:center;gap:12px}
.set-title h2{font-family:var(--f-display);font-size:19px;margin:0}
.set-title .note{margin:2px 0 0}
.set-body{display:flex;flex-direction:column;gap:12px}
.set-body>.card{margin:0}
.set-h{font-family:var(--f-display);font-size:15px;margin:0 0 8px}
.set-save{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:14px;padding:10px 0 0;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.set-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-tools .btn{flex:none}
.set-search{flex:1 1 180px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);color:var(--muted)}
.set-search .inp{border:0;background:none;padding-inline:0;flex:1;min-width:0}
.set-note{margin:0 4px}
.set-people{padding:0;overflow:hidden}
.set-people .empty{padding:22px;text-align:center;color:var(--muted)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:16px}
.av.off{background:var(--line);color:var(--muted)}
.p-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:11.5px;border-radius:999px;padding:1px 8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.tag.miss{background:var(--over-soft);border-color:transparent;color:var(--over)}
.role{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-inline-start:4px;vertical-align:1px}
.role.off{color:var(--short);background:var(--short-soft)}
.ulist{margin:6px -14px -14px}

.set-roles{display:flex;flex-direction:column;gap:10px}

.hh-figs b.neg{color:#ff9b93}.hh-figs b.pos{color:#ffd28a}
.hh-empty{margin:0;font-size:13px;opacity:.8}
.hh-alert{align-self:flex-start;border:0;background:#f3c26b;color:#1d2b3a;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.home-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 14px 16px;min-height:132px;font:inherit;color:inherit;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(14,30,52,.1)}
.tile:active{transform:scale(.98)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .ti{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--tbg);color:var(--tfg);margin-bottom:4px}
.tile .ti svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-family:var(--f-display);font-size:15px;line-height:1.4}
.tile .ts{font-size:12px;color:var(--muted);line-height:1.5}
.t-navy{--tbg:#e3eaf4;--tfg:#1d3a5f}.t-teal{--tbg:#dcf1ee;--tfg:#0f6b62}.t-indigo{--tbg:#e6e7fb;--tfg:#3b3fa8}.t-amber{--tbg:#fbefd8;--tfg:#8a5a00}
.t-green{--tbg:#e1f3e7;--tfg:#1d7a45}.t-slate{--tbg:#e8ecf0;--tfg:#45535f}.t-gold{--tbg:#f8eccd;--tfg:#7a5a0c}.t-rose{--tbg:#fbe5e6;--tfg:#a1323a}.t-plum{--tbg:#f1e4f4;--tfg:#7a3a86}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile{--tbg:rgba(255,255,255,.07)} :root:not([data-theme="light"]) .t-navy{--tfg:#9cbbe6}:root:not([data-theme="light"]) .t-teal{--tfg:#6fd3c4}:root:not([data-theme="light"]) .t-indigo{--tfg:#a9adf5}:root:not([data-theme="light"]) .t-amber,:root:not([data-theme="light"]) .t-gold{--tfg:#f1c46d}:root:not([data-theme="light"]) .t-green{--tfg:#6fd096}:root:not([data-theme="light"]) .t-slate{--tfg:#b7c3ce}:root:not([data-theme="light"]) .t-rose{--tfg:#ff9b93}:root:not([data-theme="light"]) .t-plum{--tfg:#dca6e6}}
:root{--hero:#13294a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero:#16253a}}
/* petty cash */
.pt-head{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.pt-head>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.pt-head b{font-size:19px;font-family:var(--f-display)}
.pt-bal{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.pt-bal b{font-size:15px}
.cb-a.neg{color:var(--short)}
/* currencies settings */
.fx-list{display:flex;flex-direction:column;margin:6px 0}
.fx-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.fx-row:first-child{border-top:0}
.fx-rate{display:flex;align-items:center;gap:8px}
.fx-rate .inp{width:110px}
.radio-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.radio-row input{margin-top:5px;accent-color:var(--accent)}
.radio-row span{display:flex;flex-direction:column}
